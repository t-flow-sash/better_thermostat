name: Validate

on:
  push:
    branches:
      - "**"
      - "!dependabot/**"
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, repo-better-thermostat]
    timeout-minutes: 5
    steps:
      - uses: "actions/checkout@v6"
      - name: HACS validation
        uses: "hacs/action@22.5.0"
        with:
          category: "integration"
